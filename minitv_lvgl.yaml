substitutions:
  device_name: minitv-${device_id}
  friendly_name: "MiniTV ${device_id}"
  devices: !secret devices

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: pico32
  framework:
    type: esp-idf

logger:
  # Keep api/wifi at DEBUG so the reason for a dropped HA connection is actually
  # recorded (these are the only logs that identify a disassociation, a roam, or
  # a clean TCP close). Sensor state pushes log at VERBOSE in this ESPHome
  # version, not DEBUG, so DEBUG costs almost nothing here -- measured max loop
  # time with this enabled is 30-40ms. The chatty per-render tags are pinned to
  # INFO so the UART never becomes the bottleneck.
  level: DEBUG
  logs:
    binary_sensor: INFO
    lvgl: INFO
    light: INFO
    esp32_touch: INFO
    homeassistant.sensor: INFO
    homeassistant.text_sensor: INFO
    mipi_spi: INFO
    scheduler: INFO

# Heap / fragmentation / loop-time instrumentation, surfaced to HA so a future
# drop can be correlated against resource health instead of guessed at.
debug:
  update_interval: 60s

ota:
  - platform: esphome
    password: ${ devices[device_name].ota_password }

# ─── Status feedback helpers ──────────────────────────────────────────────────
# Status LED colors: green = HA connected, blue = WiFi up but no HA, red = no WiFi.
script:
  - id: status_led_green
    then:
      - light.turn_on:
          id: status_led
          red: 0%
          green: 100%
          blue: 0%
          effect: "Slow Pulse"
  - id: status_led_blue
    then:
      - light.turn_on:
          id: status_led
          red: 0%
          green: 0%
          blue: 100%
          effect: "Slow Pulse"
  - id: status_led_red
    then:
      - light.turn_on:
          id: status_led
          red: 100%
          green: 0%
          blue: 0%
          effect: "Slow Pulse"
  # Set the status-bar WiFi glyph from the current RSSI.
  - id: update_wifi_icon
    then:
      - lvgl.label.update:
          id: status_bar_wifi_signal_icon
          text: !lambda |-
            float r = id(wifi_rssi).state;
            if (isnan(r) || r < -75) return std::string("\U000F091F");
            if (r < -65) return std::string("\U000F0922");
            if (r < -55) return std::string("\U000F0925");
            return std::string("\U000F0928");

api:
  encryption:
    key: ${ devices[device_name].api_key }
  # On 2026-09-06 23:28 EDT the device stayed powered but could not re-establish
  # the HA connection; it only recovered when this timeout fired and rebooted it
  # 13.6 minutes later (HA logged reset reason "Reboot request from api").
  # 5min keeps the self-heal backstop but caps that outage, while still riding
  # out a normal HA restart (typically 1-3min) without a spurious reboot.
  reboot_timeout: 5min
  on_client_connected:
    then:
      - script.execute: status_led_green
  on_client_disconnected:
    then:
      # Record the drop with the state that distinguishes the plausible causes:
      # wifi still up => TCP/API-level loss (interference, HA side, path);
      # wifi down     => radio/association loss. Uptime separates a reconnect
      # from a silent reboot.
      - lambda: |-
          ESP_LOGW("diag", "HA client disconnected: wifi=%d rssi=%.0f uptime=%us heap_free=%u",
                   esphome::wifi::global_wifi_component->is_connected() ? 1 : 0,
                   id(wifi_rssi).state,
                   (unsigned) (millis() / 1000),
                   (unsigned) esp_get_free_heap_size());
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: status_led_blue
          else:
            - script.execute: status_led_red

wifi:
  fast_connect: on
  power_save_mode: none
  # HA recorded three "power-on event" resets (ESP_RST_POWERON) on 2026-09-06,
  # i.e. the 3V3 rail actually collapsed -- not a panic, not a watchdog, not the
  # brownout detector, all of which ESPHome labels distinctly. WiFi transmit is
  # by far the largest current transient on this board, so capping TX power
  # shrinks it. ESPHome also feeds this to CONFIG_ESP_PHY_MAX_WIFI_TX_POWER,
  # which it documents as preventing brownout on marginal supplies. At -35 dBm
  # there is ~25 dB of link margin, so this costs nothing in range.
  #
  # Result: resets were arriving every ~2h before this; after it the device ran
  # 48h+ with zero resets and 371/371 health samples reporting the HA link up
  # (36h of that verified by a gapless serial capture, 2026-09-07/09).
  # Still a mitigation, not a cure: a rail that collapses under a normal TX
  # burst is a hardware weakness, so if resets ever return, suspect the supply,
  # cable or connector rather than this setting.
  output_power: 15dB
  # Single-AP network: ESPHome's post-connect roaming would scan every 5 minutes
  # whenever RSSI drops below -49 dBm, and a scan leaves the home channel (and a
  # successful roam re-associates outright), which tears down the HA connection.
  # With one AP there is never a better BSSID to move to, so the scan is pure
  # risk. Not the observed cause here (this device sits at -35 dBm, where the
  # check always skips), but it removes a real failure mode if signal degrades.
  post_connect_roaming: false
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Fallback ${device_name}"
    password: ${ devices[device_name].fallback_ap_password }
  on_connect:
    then:
      - if:
          condition:
            api.connected:
          then:
            - script.execute: status_led_green
          else:
            - script.execute: status_led_blue
      # Replace the disconnected glyph with current signal strength right away.
      - script.execute: update_wifi_icon
  on_disconnect:
    then:
      - script.execute: status_led_red
      - lvgl.label.update:
          id: status_bar_wifi_signal_icon
          text: "\U000F092B"

captive_portal:

# ─── SPI bus (display only, no MISO needed) ───────────────────────────────────
spi:
  clk_pin: GPIO18   # SCL
  mosi_pin: GPIO23  # SDA

# ─── Fonts ────────────────────────────────────────────────────────────────────
# montserrat_16/18/24 are LVGL built-in fonts — no explicit definition needed
font:
  - file:
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@latest/fonts/materialdesignicons-webfont.ttf"
      type: web
    id: mdi_icons_16
    size: 16
    glyphs: [
      "\U000F029A",  # mdi:gauge
      "\U000F048B",  # mdi:server
      "\U000F0502",  # mdi:television
      "\U000F050F",  # mdi:thermometer
      "\U000F0594",  # mdi:weather-night
      "\U000F0599",  # mdi:weather-sunny
      "\U000F0A33",  # mdi:calendar-week
    ]
  - file:
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@latest/fonts/materialdesignicons-webfont.ttf"
      type: web
    id: mdi_icons_24
    size: 24
    glyphs: [
      "\U000F035B",  # mdi:memory (chip temp)
      "\U000F050F",  # mdi:thermometer
      "\U000F091F",  # mdi:wifi-strength-1  (very weak)
      "\U000F0922",  # mdi:wifi-strength-2  (weak)
      "\U000F0925",  # mdi:wifi-strength-3  (medium)
      "\U000F0928",  # mdi:wifi-strength-4  (strong)
      "\U000F092B",  # mdi:wifi-strength-alert-outline (disconnected)
      "\U000F140C",  # mdi:lightning-bolt-outline
    ]
  - file:
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@latest/fonts/materialdesignicons-webfont.ttf"
      type: web
    id: mdi_icons_44
    size: 44
    glyphs: [
      "\U000F0590",  # mdi:weather-cloudy
      "\U000F0591",  # mdi:weather-fog
      "\U000F0593",  # mdi:weather-lightning
      "\U000F0595",  # mdi:weather-partly-cloudy
      "\U000F0597",  # mdi:weather-rainy
      "\U000F0598",  # mdi:weather-snowy
      "\U000F0599",  # mdi:weather-sunny
      "\U000F0F38",  # mdi:weather-tornado
    ]

# ─── Time (synced from Home Assistant) ────────────────────────────────────────
time:
  - platform: homeassistant
    id: ha_time

# ─── Sensors ──────────────────────────────────────────────────────────────────
sensor:
  # Diagnostics exposed to HA. These were flat and healthy across a 50-minute
  # bench run (heap ~143 KB, largest free block ~108 KB, max loop 29-38 ms), so
  # they are here to catch a regression, not because they are currently at risk.
  - platform: debug
    free:
      name: "MiniTV Heap Free"
      id: dbg_heap_free
      entity_category: diagnostic
    block:
      name: "MiniTV Heap Max Block"
      id: dbg_heap_block
      entity_category: diagnostic
    loop_time:
      name: "MiniTV Loop Time"
      id: dbg_loop_time
      entity_category: diagnostic

  # Uptime makes a reboot unmistakable in HA history: if the device drops off and
  # uptime resets, it restarted; if uptime keeps climbing, only the API link went.
  - platform: uptime
    name: "MiniTV Uptime"
    id: device_uptime
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_signal
    name: "MiniTV WiFi Signal"
    id: wifi_rssi
    update_interval: 30s
    on_value:
      then:
        # Only reflect signal strength while connected; the disconnected glyph
        # is owned by wifi:on_disconnect and must not be overwritten by a stray
        # reading taken while the link is down.
        - if:
            condition:
              wifi.connected:
            then:
              - script.execute: update_wifi_icon

  - platform: internal_temperature
    name: "MiniTV Chip Temperature"
    id: chip_temp
    update_interval: 30s
    filters:
      - offset: -41.0
    on_value:
      then:
        - lvgl.label.update:
            id: status_bar_chip_temp_value
            text: !lambda return str_sprintf("%.1f°C", x);

  - platform: homeassistant
    entity_id: sensor.server_room_cyberpower_load_power_watt_derived
    id: server_power
    name: "Server Room Power"
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: server_room_left_value
            text: !lambda return str_sprintf("%.0fW", x);

  - platform: homeassistant
    entity_id: sensor.server_room_temperature
    id: server_room_temp
    name: "Server Room Temperature"
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: server_room_right_value
            text: !lambda return str_sprintf("%.1f°C", x);

  - platform: homeassistant
    entity_id: sensor.shellypmminig3_ecda3bc6f94c_power
    id: desktop_power
    name: "Desktop Power"
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: living_room_left_value
            text: !lambda return str_sprintf("%.0fW", x);

  - platform: homeassistant
    entity_id: sensor.living_room_current_temperature
    id: living_room_temp
    name: "Living Room Temperature"
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: living_room_right_value
            text: !lambda return str_sprintf("%.1f°C", x);

  - platform: homeassistant
    entity_id: sensor.openweathermap_temperature
    id: outside_temp
    name: "Outside Temperature"
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: weather_outdoor_temp_value
            text: !lambda return str_sprintf("%.1f°C", x);

  - platform: homeassistant
    entity_id: sensor.openweathermap_humidity
    id: outside_humidity
    name: "Outside Humidity"
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: weather_outdoor_humidity_value
            text: !lambda return str_sprintf("%.0f%%", x);

  - platform: homeassistant
    entity_id: sensor.openweathermap_pressure
    id: outside_pressure
    name: "Outside Pressure"
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: weather_outdoor_pressure_value
            text: !lambda return str_sprintf("%.0fhPa", x);

  - platform: homeassistant
    entity_id: sensor.openweathermap_weather_code
    id: weather_code
    name: "Weather Code"
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: weather_outdoor_status_icon
            text: !lambda |-
              int c = (int)x;
              if (c == 800)             return std::string("\U000F0599");
              if (c >= 801 && c <= 803) return std::string("\U000F0595");
              if (c == 804)             return std::string("\U000F0590");
              if (c >= 500 && c <= 531) return std::string("\U000F0597");
              if (c >= 300 && c <= 321) return std::string("\U000F0597");
              if (c >= 600 && c <= 622) return std::string("\U000F0598");
              if (c >= 200 && c <= 232) return std::string("\U000F0593");
              if (c >= 700 && c <= 781) {
                if (c == 781)           return std::string("\U000F0F38");
                else                    return std::string("\U000F0591");
              }
              return std::string("\U000F0599");

# ─── Text sensors for sunrise / sunset ───────────────────────────────────────
# HA provides UTC ISO 8601 datetimes; convert to local time via ha_time UTC offset.
text_sensor:
  # Survives a restart, so it distinguishes a crash (panic/WDT/brownout) from a
  # clean OTA or power-cycle after the fact.
  - platform: debug
    reset_reason:
      name: "MiniTV Reset Reason"
      entity_category: diagnostic

  - platform: homeassistant
    entity_id: sensor.sun_next_rising
    id: sun_rise_raw
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: weather_outdoor_sun_rise_value
            text: !lambda |-
              if (x.length() < 16) return x;
              auto local = id(ha_time).now();
              auto utc   = id(ha_time).utcnow();
              int off = (local.hour - utc.hour) * 60 + (local.minute - utc.minute);
              if (off >  720) off -= 1440;
              if (off < -720) off += 1440;
              int h = std::stoi(x.substr(11, 2));
              int m = std::stoi(x.substr(14, 2));
              int t = (h * 60 + m + off + 1440) % 1440;
              return str_sprintf("%02d:%02d", t / 60, t % 60);

  - platform: homeassistant
    entity_id: sensor.sun_next_setting
    id: sun_set_raw
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: weather_outdoor_sun_set_value
            text: !lambda |-
              if (x.length() < 16) return x;
              auto local = id(ha_time).now();
              auto utc   = id(ha_time).utcnow();
              int off = (local.hour - utc.hour) * 60 + (local.minute - utc.minute);
              if (off >  720) off -= 1440;
              if (off < -720) off += 1440;
              int h = std::stoi(x.substr(11, 2));
              int m = std::stoi(x.substr(14, 2));
              int t = (h * 60 + m + off + 1440) % 1440;
              return str_sprintf("%02d:%02d", t / 60, t % 60);

# ─── Touch pads ───────────────────────────────────────────────────────────────
# To calibrate: set setup_mode: true, flash, check serial logs for raw values,
# set threshold just above the idle value, then set setup_mode: false.
esp32_touch:
  setup_mode: false

binary_sensor:
  # Touch pads are local-only (not exposed to HA) and control the backlight.
  - platform: esp32_touch
    name: "Left Touch"
    internal: true
    pin: GPIO13
    threshold: 500
    on_press:
      then:
        - light.dim_relative:
            id: backlight
            relative_brightness: -20%

  - platform: esp32_touch
    name: "Right Touch"
    internal: true
    pin: GPIO15
    threshold: 500
    on_press:
      then:
        - light.dim_relative:
            id: backlight
            relative_brightness: +20%

# ─── Display backlight (PWM, controllable from HA) ────────────────────────────
output:
  - platform: ledc
    pin: GPIO4
    id: backlight_pwm

# ─── WS2812B status LED + display backlight ───────────────────────────────────
light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: WS2812
    pin: GPIO27
    num_leds: 1
    name: "MiniTV Status LED"
    id: status_led
    internal: true
    restore_mode: ALWAYS_ON
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 1s
          update_interval: 2s
          min_brightness: 0%
          max_brightness: 70%

  - platform: monochromatic
    output: backlight_pwm
    name: "MiniTV Display Backlight"
    id: backlight
    internal: true
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

# ─── Intervals ────────────────────────────────────────────────────────────────
interval:
  # One health line per 5 minutes. Cheap, and it means a serial capture during a
  # future drop already has the surrounding heap/loop/link context.
  - interval: 300s
    then:
      - lambda: |-
          ESP_LOGI("diag",
                   "heap_free=%u heap_min=%u max_block=%u loop_max_ms=%u api_conn=%d wifi=%d rssi=%.0f uptime=%us",
                   (unsigned) esp_get_free_heap_size(),
                   (unsigned) esp_get_minimum_free_heap_size(),
                   (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT),
                   (unsigned) id(dbg_loop_time).state,
                   esphome::api::global_api_server->is_connected() ? 1 : 0,
                   esphome::wifi::global_wifi_component->is_connected() ? 1 : 0,
                   id(wifi_rssi).state,
                   (unsigned) (millis() / 1000));

  # Clock ticks every second — only the time label re-renders/flushes.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(ha_time).now().is_valid();
          then:
            - lvgl.label.update:
                id: status_bar_time_value
                text: !lambda return id(ha_time).now().strftime("%H:%M:%S");

  # Date and weekday only change once per day — refresh once a minute.
  - interval: 60s
    then:
      - if:
          condition:
            lambda: return id(ha_time).now().is_valid();
          then:
            - lvgl.label.update:
                id: weather_date_value
                text: !lambda |-
                  auto t = id(ha_time).now();
                  return str_sprintf("%d/%d", t.month, t.day_of_month);
            - lvgl.label.update:
                id: weather_weekday_value
                text: !lambda |-
                  static const char* days[] = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
                  return std::string(days[id(ha_time).now().day_of_week - 1]);

# ─── ST7789V3 240×240 display (LVGL-controlled, no lambda) ───────────────────
display:
  - platform: mipi_spi
    model: ST7789V
    id: main_display
    dc_pin: GPIO2       # RS
    reset_pin: GPIO19
    # cs_pin omitted: CS is wired to GND (permanently selected)
    invert_colors: true
    data_rate: 40MHz
    spi_mode: mode3
    dimensions:
      width: 240
      height: 240
      offset_width: 0
      offset_height: 80
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: true
    auto_clear_enabled: false

# ─── LVGL ─────────────────────────────────────────────────────────────────────
lvgl:
  displays:
    - main_display
  # 25% of the frame (~28 KB, ~6 ms per flush at 40 MHz). Kept because it is a
  # reasonable RAM/latency trade, NOT because flush length was ever the cause of
  # the HA drops -- measured max loop time is 30-40 ms, far inside the API's
  # ~90 s tolerance.
  buffer_size: 25%
  pages:
    - id: canvas_1
      bg_color: 0x000000
      pad_all: 0
      widgets:
        - obj:
            id: status_bar_left_section
            x: 0
            y: 0
            width: 120
            height: 35
            align: TOP_LEFT
            bg_color: 0x000000
            bg_opa: 0%
            border_color: 0x000000
            border_opa: 0%
            pad_all: 0
            widgets:
              - label:
                  id: status_bar_wifi_signal_icon
                  x: 0
                  y: 0
                  width: 30
                  height: 30
                  align: LEFT_MID
                  text: "\U000F092B"
                  text_font: mdi_icons_24
                  text_align: CENTER
                  text_color: 0xFFFFFF
              - label:
                  id: status_bar_time_value
                  x: 32
                  y: 0
                  height: 20
                  align: LEFT_MID
                  text: "00:00:00"
                  text_color: 0xFFFFFF
                  long_mode: CLIP
                  text_font: montserrat_18

        - obj:
            id: status_bar_right_section
            x: 0
            y: 0
            width: 120
            height: 35
            align: TOP_RIGHT
            bg_color: 0x000000
            bg_opa: 0%
            border_color: 0x000000
            border_opa: 0%
            pad_all: 0
            widgets:
